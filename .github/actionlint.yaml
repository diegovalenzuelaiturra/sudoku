# ubuntu-26.04 is a GitHub-hosted image, generally available since October
# 2026, but actionlint's table of hosted labels stops at ubuntu-24.04: v1.7.12
# and its main branch as of 2026-10-25 both reject it as unknown. This list is
# actionlint's documented way to admit a label it does not know. Only the exact
# label is admitted, so a mistyped runs-on still fails. Delete this file once
# an actionlint release lists ubuntu-26.04 itself.
self-hosted-runner:
  labels:
    - ubuntu-26.04
