name: OSV-Scanner

# Checks the dependency tree against the OSV database on every pull request.
# The point is not that this repo has many dependencies, it has three direct
# ones and all of them are dev-only. The point is the transitive tree behind
# them, which is where a compromised release actually arrives.
#
# What this adds over what already runs here:
#
#   Dependabot alerts are enabled and cover much of the same GHSA data, but
#   they are a notification on a page nobody opens during review. This is a red
#   mark on the pull request that introduces the problem, when it is introduced.
#
#   The Dependabot cooldown in dependabot.yml is the stronger control and works
#   the other way round: it refuses to consider any release younger than a week
#   rather than trying to recognise a bad one. This catches what is already
#   known; the cooldown covers the window before anything is known. Neither
#   replaces the other. Recent npm compromises were advisory-listed a few hours
#   after publication in one case and more than a day in another, and the
#   cooldown is what covers that gap.
#
# Deliberately NOT a required status check. It reaches the OSV API, so a
# network failure should never be able to wedge a merge. A red mark a human can
# read and override is the right shape for a one-maintainer repo.

on:
  pull_request:

permissions: {}

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Publishing SARIF so findings appear under Security, Code scanning.
      # Free on public repositories.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upstream ships a reusable workflow that does all of this, and it is
      # what their docs recommend. It cannot be used here. This repository's
      # Actions policy is "selected", allowing GitHub-owned and verified-creator
      # actions with an empty pattern list, and a third-party REUSABLE WORKFLOW
      # is covered by neither of those checkboxes: it needs an explicit entry in
      # the allowed patterns. Adding one would loosen the policy permanently to
      # save the twenty lines below, so the binary is fetched directly instead.
      #
      # The checksum is the real pin. Downloading the published SHA256SUMS file
      # and checking against that would prove only that the transfer was
      # intact, since an attacker able to replace one asset can replace both.
      # The expected hash is therefore written here, in a file that only changes
      # through a reviewed commit. Bump both lines together when upgrading.
      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          curl --fail --silent --show-error --location \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # Reads package-lock.json. node_modules is deliberately absent from this
      # job, so there is nothing for the scanner to walk into and no install
      # step to go wrong.
      #
      # continue-on-error so a finding still reaches the Security tab below.
      # The scan's verdict is reapplied as the job's verdict in the last step,
      # so a vulnerability still turns this job red.
      - name: Scan the dependency tree
        id: scan
        continue-on-error: true
        run: ./osv-scanner scan source --recursive --format=sarif --output-file=osv.sarif .

      # github/codeql-action is in the "github" organisation, which the Actions
      # policy does allow, so this one is available where the reusable workflow
      # above was not.
      - name: Publish findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      # Every dependency here is dev-only, so a finding is worth reading before
      # it is worth panicking about: nothing in the tree is served to a visitor.
      # The two minifiers do rewrite the bytes that are served, though, so a
      # compromise there reaches production even from a dev dependency.
      #
      # To accept a specific advisory, add it to osv-scanner.toml as an
      # [[IgnoredVulns]] entry with a reason rather than deleting this step.
      - name: Fail if the scan found anything
        if: steps.scan.outcome == 'failure'
        run: |
          echo "osv-scanner reported findings. See the Security tab, Code scanning." >&2
          exit 1
