name: OSV-Scanner

# Checks the dependency tree against the OSV database when a pull request moves
# the manifests, and once a week whether anything moved or not. The point is not
# that this repo has many dependencies, it has three direct ones and all of them
# are dev-only. The point is the transitive tree behind them, which is where a
# compromised release actually arrives.
#
# What this adds over what already runs here:
#
#   Dependabot alerts are enabled and cover much of the same GHSA data, but
#   they are a notification on a page nobody opens during review. This is a red
#   mark on the pull request that introduces the problem, when it is introduced.
#
#   The Dependabot cooldown in dependabot.yml is the stronger control and works
#   the other way round: it refuses to consider any release younger than a week
#   rather than trying to recognise a bad one. This catches what is already
#   known; the cooldown covers the window before anything is known. Neither
#   replaces the other. Recent npm compromises were advisory-listed a few hours
#   after publication in one case and more than a day in another, and the
#   cooldown is what covers that gap.
#
# This gates a merge into development, through the code scanning rule in
# "development protection" and not through required_status_checks. The rule
# reads alerts: an error level finding, or a security finding of high or higher,
# blocks the merge, and the same rule already carries CodeQL and zizmor. A
# maintainer who has read the finding can still merge, by resolving or
# dismissing the alert, which is the override this repo needs.
#
# The gate lives in the ruleset because a ruleset binds every path into
# development at once: this workflow, GitHub's auto-merge queue, and a person
# clicking the button. A check consulted by the Dependabot merge job alone would
# bind that job alone.
#
# The price is paid here, and it is real. The scan reaches the OSV API, so an
# outage there now holds a merge until an analysis can be produced, where before
# it could only leave a red mark next to one.
#
# Using this at all needed a policy change. The repository's Actions setting is
# "selected", and the GitHub-owned and verified-creator checkboxes do not cover
# a third-party REUSABLE WORKFLOW: those two apply to actions, and a reusable
# workflow from another repository needs an explicit allowed pattern whoever
# publishes it. "google/osv-scanner-action/*" is in that list, which is what
# lets the pull request job below start at all.
#
# One caveat, recorded rather than hidden, and it applies to that job alone.
# Every "uses:" inside the reusable workflow it calls is a full commit SHA, but
# it bottoms out in an action whose runtime is
# "image: docker://ghcr.io/google/osv-scanner-action:v2.5.1", an image tag
# rather than a digest. Pinning the reference does not pin that image, so that
# job is the one exception to the repository's otherwise total SHA pinning.
# Accepted knowingly, in exchange for upstream maintenance and the
# base-versus-head diffing described below. The scheduled job makes no such
# exception, for a reason written down where it is defined.
#
# The answer is not a function of package-lock.json alone, which is why there is
# a schedule as well as a pull request trigger. OSV publishes advisories
# continuously and retroactively, so a version locked one month can be flagged
# the next with nothing in the diff to notice, and three dev-only dependencies
# behind a seven-day cooldown can sit still for a long time. A pull request run
# answers for the tree as that pull request leaves it; the schedule re-asks
# about one that has not moved.
#
# Every pull request, with no path filter. A code scanning rule that names a
# tool waits for an analysis from that tool, so a pull request that skipped this
# workflow would wait for a result that never arrives.
on:
  pull_request:
  # Mondays at 06:00 UTC. Weekly rather than daily because a re-scan only
  # changes its answer when OSV publishes something, and the start of the week
  # puts this beside Dependabot's weekly run rather than five days after it.
  # dependabot.yml asks for "interval: weekly" without naming a day, and
  # GitHub's Dependabot options reference does not document which day that
  # resolves to, so read the alignment as roughly, not exactly, the same
  # morning. A scheduled run always uses the default branch's copy of this file
  # and scans the default branch's lockfile, which is the tree that is actually
  # published.
  schedule:
    - cron: "0 6 * * 1"
  # For re-asking on the spot after an advisory is dealt with, rather than
  # waiting until Monday to learn whether the fix took.
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-${{ github.ref }}
  # Superseding is right on a pull request, where only the newest push is worth
  # an answer, and wrong everywhere else: a scheduled run and a manual one share
  # the default branch's ref, so left at true whichever started second would
  # cancel the other and silence an answer nobody asked to discard.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-pr:
    # Two jobs share this file and every trigger above starts all of it, so each
    # one names the events it is for or it would run on the others as well.
    # Written as an equality rather than as "not a schedule" so that a trigger
    # added later has to be routed to a job on purpose.
    if: github.event_name == 'pull_request'
    # The PR variant rather than the full-scan one. It scans base and head and
    # reports only what the pull request newly introduces, so a long-lived
    # advisory in a dev-only transitive dependency does not re-flag every
    # unrelated change.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    # Restated rather than inherited. The workflow-level default above is no
    # permissions at all, and a called workflow cannot be granted more than its
    # caller holds, so leaving this out would starve it.
    permissions:
      # Required by codeql-action to upload the SARIF file.
      actions: read
      contents: read
      # Publishes findings under Security, Code scanning. Free on public
      # repositories. This is the widest permission granted anywhere outside
      # the deploy job, and it goes to third-party code, which is why it is
      # scoped to this one job.
      security-events: write

  # Written out by hand rather than calling the full-scan sibling of the
  # reusable workflow above, which is what a schedule needs: that variant scans
  # base against head, and on a schedule there is no base to diff against.
  #
  # The scan is run directly. Every reference below is a commit SHA or a
  # checksum, so this job carries none of the docker image tag exception
  # recorded at the top of this file. What is given up is upstream maintenance
  # of the scan invocation.
  scan-full:
    name: Scheduled scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # No actions: read here, unlike scan-pr. That scope exists for the
      # reusable workflow's artifact handling, and nothing below reads the
      # Actions API.
      contents: read
      # Publishes findings under Security, Code scanning. Free on public
      # repositories.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary, verified against the checksum published in
      # osv-scanner_SHA256SUMS for this tag rather than trusted because the
      # download succeeded. A tag on a release asset can be moved; the checksum
      # is what makes this equivalent to a SHA pin.
      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # Recursive from the checkout root, which is the same target the reusable
      # workflow's default scan-args ("-r ./") would have used, so a manifest
      # added in a subdirectory later is covered without another edit.
      #
      # continue-on-error, because a non-zero exit here means findings, and the
      # findings still have to reach the Security tab before the run fails. The
      # step below is what fails it.
      - name: Scan the dependency tree
        id: scan
        continue-on-error: true
        run: ./osv-scanner scan source --recursive --format=sarif --output-file=osv.sarif .

      - name: Publish findings to code scanning
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      # Matches the fail-on-vuln default of the reusable workflow: a standing
      # advisory turns this job red every Monday until it is dealt with, which
      # is the whole point of running it on a schedule.
      - name: Fail if the scan found anything
        if: steps.scan.outcome == 'failure'
        run: |
          echo "osv-scanner reported findings. See the Security tab, Code scanning." >&2
          exit 1
