name: OSV-Scanner

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: OSV scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Publishes findings under Security, Code scanning. Free on public
      # repositories.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # MUST KILL: scan exit code survives only through an implicit bash -e shell, naming the shell in code would make it obvious
      - name: Scan the dependency tree
        id: scan
        run: |
          set -uo pipefail
          code=0
          ./osv-scanner scan source --recursive --format=sarif --output-file=osv.sarif . || code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]

      - name: Publish findings to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      - name: Fail if the scan found anything
        if: steps.scan.outputs.code == '1'
        run: |
          echo "osv-scanner reported findings. See the Security tab, Code scanning." >&2
          exit 1
