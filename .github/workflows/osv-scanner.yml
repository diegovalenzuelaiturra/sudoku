name: OSV-Scanner

# Checks the dependency tree against the OSV database on every pull request, and
# once a week whether anything moved or not. The point is not that this repo has
# many dependencies, it has three direct ones and all of them are dev-only. The
# point is the transitive tree behind them, which is where a compromised release
# actually arrives.
#
# What this adds over what already runs here:
#
#   Dependabot alerts are enabled and cover much of the same GHSA data, but
#   they are a notification on a page nobody opens during review. This is a red
#   mark on the pull request that introduces the problem, when it is introduced.
#
#   The Dependabot cooldown in dependabot.yml is the stronger control and works
#   the other way round: it refuses to consider any release younger than a week
#   rather than trying to recognise a bad one. This catches what is already
#   known; the cooldown covers the window before anything is known. Neither
#   replaces the other. Recent npm compromises were advisory-listed a few hours
#   after publication in one case and more than a day in another, and the
#   cooldown is what covers that gap.
#
# This gates a merge into development, through the code scanning rule in
# "development protection" that also carries CodeQL and zizmor. The rule reads
# alerts and not the outcome of this job. osv-scanner writes every finding at
# warning level, and an advisory with no CVSS score, which is what a malicious
# package usually arrives as, carries no security severity either. The rule's
# alerts threshold is what reaches those two, and it is set to warnings for this
# tool. The severity threshold alone would let them through.
#
# The gate lives in the ruleset because a ruleset binds every route into
# development at once: the Dependabot merge job, the auto-merge queue that job
# arms, and a person clicking the button.
#
# Three consequences, all of them chosen:
#
#   Every pull request runs this. A code scanning rule that names a tool waits
#   for an analysis from that tool, so a pull request that skipped this workflow
#   would wait for a result that never arrives.
#
#   A scan that cannot answer holds the merge. The scanner writes its SARIF only
#   when it finished, so a network failure leaves no file, the upload fails, no
#   analysis is published, and the rule keeps the merge closed. Re-running the
#   job is the way out, and there is no bypass actor on the ruleset.
#
#   A standing advisory blocks every pull request, not only the one that
#   introduced it. This reports the whole tree at the head of the pull request,
#   so an advisory published against a version locked weeks ago stops the queue
#   until someone deals with it.
on:
  pull_request:
  # A release merge commit needs an analysis of its own. The fast forward that
  # follows a release pushes that commit onto development, the code scanning
  # rule there names this tool, and a push rule reads the result for the commit
  # being pushed. A pull request run answers for the pull request's head, which
  # is a different commit, so without this the fast forward is refused until
  # someone dispatches a run by hand. codeql.yml and zizmor.yml carry the same
  # trigger for the same reason.
  push:
    branches: [main]
  # Mondays at 06:00 UTC. Weekly rather than daily because a re-scan only
  # changes its answer when OSV publishes something, and the start of the week
  # puts this beside Dependabot's weekly run rather than five days after it.
  # dependabot.yml asks for "interval: weekly" without naming a day, and
  # GitHub's Dependabot options reference does not document which day that
  # resolves to, so read the alignment as roughly, not exactly, the same
  # morning. A scheduled run always uses the default branch's copy of this file
  # and scans the default branch's lockfile, which is the tree that is actually
  # published.
  schedule:
    - cron: "0 6 * * 1"
  # For re-asking on the spot after an advisory is dealt with, rather than
  # waiting until Monday to learn whether the fix took.
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-${{ github.ref }}
  # Superseding is right on a pull request, where only the newest push is worth
  # an answer, and wrong everywhere else: a scheduled run and a manual one share
  # the default branch's ref, so left at true whichever started second would
  # cancel the other and silence an answer nobody asked to discard.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job for every trigger. The scan is run directly, so every reference here
  # is a commit SHA or a checksum, the runner label and the timeout belong to
  # this file, and the SARIF is published under one category.
  scan:
    name: OSV scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Publishes findings under Security, Code scanning. Free on public
      # repositories.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary, verified against the checksum published in
      # osv-scanner_SHA256SUMS for this tag rather than trusted because the
      # download succeeded. A tag on a release asset can be moved; the checksum
      # is what makes this equivalent to a SHA pin.
      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # Recursive from the checkout root, so a manifest added in a subdirectory
      # later is covered without another edit.
      - name: Scan the dependency tree
        id: scan
        run: |
          set -uo pipefail
          ./osv-scanner scan source --recursive --format=sarif --output-file=osv.sarif .
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # 0 is a clean tree and 1 is findings. Both wrote the file the upload
          # step needs, so neither ends the job on this line. Any other code is
          # the scanner failing to answer at all, which writes no file, and
          # stopping here is what keeps an empty analysis from being published
          # in place of the one that could not be produced. The merge then holds
          # on a missing analysis instead of passing on an empty one.
          [ "$code" -le 1 ]

      - name: Publish findings to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: osv.sarif
          # One category for every run of this file. Code scanning reads a
          # category as a configuration, and a configuration that exists on the
          # base branch but not on a pull request leaves the check neutral and
          # the rule unsatisfied.
          category: osv-scanner

      # A standing advisory turns this red on every run until someone deals with
      # it, which is the whole point of running it on a schedule as well.
      - name: Fail if the scan found anything
        if: steps.scan.outputs.code == '1'
        run: |
          echo "osv-scanner reported findings. See the Security tab, Code scanning." >&2
          exit 1
