name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one midway, so a run cannot leave the
# published site half-replaced.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Named "Verify" rather than "Test" so it cannot be confused with the CI
  # workflow's "Test" job, which the "main protection" ruleset requires by name.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # A hung job otherwise runs to GitHub's 360-minute default.
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs. A tag like v7 is mutable, so
      # pinning by tag would let a moved tag swap the action out from under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts would otherwise execute
      # arbitrary code on the runner at install time. Verified the suite passes
      # without them.
      - run: npm ci --ignore-scripts

      - run: npm test

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    # A hung job otherwise runs to GitHub's 360-minute default.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The site is a single self-contained file. Publish only that, so tests,
      # workflows and package metadata are not served alongside it.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
