name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      assets: ${{ steps.assets.outputs.list }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      # MUST KILL: npm pin repeated in four jobs as env strings, one shared source removes the repeat
      - name: Install npm
        env:
          NPM_VERSION: 12.2.1
          NPM_INTEGRITY: sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-${NPM_VERSION}"
          mkdir -p "$dir/npm" "$dir/bin"
          curl --fail --silent --show-error --location \
            --output "$dir/npm.tgz" \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$dir/npm.tgz" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm ${NPM_VERSION} does not match its pinned integrity" >&2
            exit 1
          fi
          tar -xzf "$dir/npm.tgz" -C "$dir/npm" --strip-components 1
          for cli in npm npx; do
            printf '#!/bin/sh\nexec node "%s/npm/bin/%s-cli.js" "$@"\n' "$dir" "$cli" > "$dir/bin/$cli"
            chmod 755 "$dir/bin/$cli"
          done
          [ "$("$dir/bin/npm" --version)" = "$NPM_VERSION" ]
          echo "$dir/bin" >> "$GITHUB_PATH"

      # MUST KILL: later steps gate on steps.install.outcome, a job boundary would state the gate
      - id: install
        run: npm ci --ignore-scripts

      - name: Build site
        env:
          BUILD_ID: ${{ github.sha }}
        run: npm run build

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Install browsers for Playwright
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:e2e

      - name: Build the artifact
        env:
          BUILD_ID: ${{ github.sha }}
        run: npm run build

      # Control characters are rejected at this end rather than in the probe
      # loop. Everything downstream is printed on a job's stdout, where GitHub
      # reads ::error:: and ::stop-commands:: as instructions rather than text,
      # so a crafted filename could forge annotations or switch off the ones the
      # smoke test exists to emit. Failing here also means the bad name never
      # reaches a job holding pages: write.
      - name: List the published files
        id: assets
        run: |
          set -euo pipefail
          if find _site -type f -print0 | LC_ALL=C grep -qzP '[\x01-\x1f]'; then
            printf '::error::a published filename holds a control character\n'
            exit 1
          fi
          # Random delimiter. A fixed one is a second way to forge output from a
          # filename: a published file named exactly like the delimiter ends the
          # heredoc early and everything after it is read as further job outputs.
          # Control characters are already rejected above, but "PUBLISHED_EOF" is
          # a perfectly ordinary filename.
          delimiter="PUBLISHED_EOF_$(openssl rand -hex 16)"
          {
            printf 'list<<%s\n' "$delimiter"
            find _site -type f | sed 's|^_site/||' | sort
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
          printf 'listed %s file(s)\n' "$(find _site -type f | wc -l | tr -d ' ')"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # MUST KILL: publish credentials sit in a job guarded by prose and a regex test, a separate deploy workflow file would enforce it
  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-26.04
    # pages: write publishes the artifact; id-token: write signs the OIDC token
    # deploy-pages exchanges for it. Nothing else in the workflow needs either.
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke test the published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED: ${{ needs.verify.outputs.assets }}
        run: |
          set -euo pipefail

          if [ -z "${PAGE_URL:-}" ]; then
            printf '::error::the deploy step reported no page_url\n'
            exit 1
          fi

          base="${PAGE_URL%/}"

          # Prints the status code and nothing else. || true keeps a connection
          # failure, which curl reports as 000, from aborting the whole step
          # before it can be retried or reported.
          probe() {
            curl --silent --show-error --location --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "$1" || true
          }

          status=000
          for attempt in 1 2 3 4 5; do
            status="$(probe "$base/")"
            if [ "$status" = "200" ]; then
              break
            fi
            printf 'attempt %s: %s/ returned %s\n' "$attempt" "$base" "$status"
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done
          if [ "$status" != "200" ]; then
            printf '::error::%s/ returned %s, expected 200\n' "$base" "$status"
            exit 1
          fi
          printf 'ok: %s/ returned 200\n' "$base"

          failed=0
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if [ "$asset" = "index.html" ]; then
              continue
            fi
            status="$(probe "$base/$asset")"
            if [ "$status" = "200" ]; then
              printf 'ok: %s returned 200\n' "$asset"
            elif [ "$status" = "404" ] && [ "$asset" = "404.html" ]; then
              printf 'ok: %s returned 404, which is how Pages serves it\n' "$asset"
            else
              printf '::error::%s returned %s, expected 200\n' "$asset" "$status"
              failed=1
            fi
          done <<< "$PUBLISHED"

          exit "$failed"

  lighthouse:
    name: Lighthouse
    needs: deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # MUST KILL: npm pin repeated in four jobs as env strings, one shared source removes the repeat
      - name: Install npm
        env:
          NPM_VERSION: 12.2.1
          NPM_INTEGRITY: sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-${NPM_VERSION}"
          mkdir -p "$dir/npm" "$dir/bin"
          curl --fail --silent --show-error --location \
            --output "$dir/npm.tgz" \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$dir/npm.tgz" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm ${NPM_VERSION} does not match its pinned integrity" >&2
            exit 1
          fi
          tar -xzf "$dir/npm.tgz" -C "$dir/npm" --strip-components 1
          for cli in npm npx; do
            printf '#!/bin/sh\nexec node "%s/npm/bin/%s-cli.js" "$@"\n' "$dir" "$cli" > "$dir/bin/$cli"
            chmod 755 "$dir/bin/$cli"
          done
          [ "$("$dir/bin/npm" --version)" = "$NPM_VERSION" ]
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Run Lighthouse against the published site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          npx --yes lighthouse@13.5.0 "$PAGE_URL" \
            --preset=desktop \
            --only-categories=performance,accessibility \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Check the performance budget
        run: node scripts/check-budget.mjs lighthouse-report.json
