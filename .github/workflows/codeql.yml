name: CodeQL

# Findings do not turn this job red. codeql-action/analyze fails on an internal
# error, not on an alert, which is deliberate upstream: the alert belongs in the
# Security tab where it can be triaged and stays triaged.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Not "CodeQL". Uploading SARIF makes GitHub publish a check run of its own
    # named after the tool in the file, so a job called CodeQL puts two rows
    # with one name on every pull request and leaves it to the reader to work
    # out which of them is the analysis and which is the result.
    name: CodeQL analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # Publishes findings under Security, Code scanning. Free on public
      # repositories.
      security-events: write
      contents: read
      # Read by codeql-action to reach the workflow run it belongs to.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript,actions

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
