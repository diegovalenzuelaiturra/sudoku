name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the suite be re-run on demand without an empty commit, which matters
  # when a failure was the runner or the network rather than the code. Pick the
  # branch in the Actions tab; main is what the ruleset requires a green Test
  # on, so that is the usual choice. This needs no extra permission: the job
  # below still runs read-only, and the deploy workflow is a separate file.
  workflow_dispatch:

# Empty at the workflow level rather than a shared contents: read. Each job
# below grants itself the read scope its checkout needs, so a job added later
# starts with no token scopes at all and has to name what it wants instead of
# inheriting one by forgetting to ask.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull request runs supersede each other. Every push to main shares the
  # one group ci-refs/heads/main, so cancelling there would let two merges
  # landing close together kill the earlier run and leave the commit that just
  # landed with no verdict at all. That is the commit the "main protection"
  # ruleset wants a green Test on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The "main protection" and "development protection" rulesets both require
    # this check by name. Renaming it blocks every PR until the required status
    # check in each of them is updated to match, so change all three together or
    # not at all.
    name: Test
    # Pinned rather than ubuntu-latest, which is a label that migrates to a new
    # image over weeks: the node, browser and system packages under this suite
    # would then change without a commit here to point at.
    runs-on: ubuntu-24.04
    # A hung job otherwise runs to GitHub's 360-minute default. 20 rather than
    # the previous 15, because there are two engines to download on a cold
    # cache now, and the suite runs against both.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs. A tag like v7 is mutable, so
      # pinning by tag would let a moved tag swap the action out from under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts would otherwise execute
      # arbitrary code on the runner at install time. Verified the suite passes
      # without them.
      #
      # The id is what the steps below gate on. Steps run in order and a failed
      # one stops the rest by default, so a broken build used to mean the
      # coverage floor and the browser suite never reported and you learned one
      # problem per push. They are independent checks, so each one now carries
      # "!cancelled() && this step succeeded" and reports on its own. The
      # install is the one dependency all of them share: the build step and
      # tests/site.test.mjs both run scripts/build.mjs, which imports
      # html-minifier-terser and terser, and the two steps below drive the
      # playwright CLI that npm ci puts in node_modules/.bin. Letting them run
      # after a failed install would add a wall of module noise on top of the
      # failure that explains it.
      - id: install
        run: npm ci --ignore-scripts

      # Assembly runs on every pull request, not only on the way to production,
      # so a build that no longer produces a publishable site fails here rather
      # than on main. BUILD_ID is passed in the same shape the deploy workflow
      # uses, so both workflows exercise one code path.
      - name: Build site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BUILD_ID: ${{ github.sha }}
        run: npm run build

      # Runs the unit suite with a coverage floor rather than a bare "npm test".
      # The thresholds sit a few points under what the suite measures today
      # (88.65 line, 77.19 branch, 89.47 function), so they catch a real
      # regression without failing on a rounding wobble.
      #
      # Worth knowing what this does not do: V8 only reports files that were
      # actually loaded, so a brand new script that no test imports stays
      # invisible to the percentage instead of dragging it to zero. The floor
      # protects code that is already tested. It is not a guarantee that every
      # file is tested. scripts/check-budget.mjs is exactly that case today.
      #
      # Deliberately still runs when the build step above failed, because it
      # does not read what that step produced: tests/site.test.mjs spawns
      # scripts/build.mjs itself and asserts on the _site that spawn writes. A
      # broken build fails both, which is two reports of one cause rather than
      # one cause hiding a coverage regression.
      - name: Test with coverage floor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage

      # Browsers are not part of the npm package and have to be fetched
      # separately. This step is not a workaround for --ignore-scripts, whatever
      # a previous version of this comment claimed: @playwright/test 1.62
      # declares no lifecycle scripts at all, so the download would not happen
      # with or without that flag. Both engines the suite declares as projects:
      # chromium, and webkit because every copy of this app installed to an iOS
      # home screen runs on WebKit, whichever browser installed it.
      - name: Install browsers for Playwright
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit

      # Runs after npm test so a unit failure, which is cheaper to read, is not
      # buried under a browser log.
      #
      # Named against the download rather than the install, which it implies: a
      # skipped or failed install leaves steps.browsers.outcome at "skipped", so
      # the one clause covers both. With no browser on disk, playwright test
      # exits on a missing executable and says nothing about this repository, so
      # a failed download must skip this rather than turn into a second
      # confusing red.
      #
      # The build step is left out of the condition, but not because a build
      # break is usefully reported here. playwright.config.mjs rebuilds _site in
      # its own webServer command, and that command is "node scripts/build.mjs
      # && node e2e/static-server.mjs", so a broken build short circuits it, the
      # server never starts and no spec runs. What this step reports then is a
      # webServer failure, which names neither the build nor this repository.
      # Left ungated anyway, so that a green build serving a broken page is
      # still caught, at the cost of one wasted browser download per broken
      # build.
      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:e2e

  lint:
    # Runs the git hooks from .pre-commit-config.yaml. A hook is only a
    # courtesy: "git commit --no-verify" skips every one of them, and a
    # contributor who never installs prek never runs them at all. This job is
    # what makes them mean something, and it reads the same config file rather
    # than a second copy of the rules, so the two cannot drift.
    #
    # Both the "main protection" and "development protection" rulesets now
    # require this check by name, alongside "Test", so a failure here blocks the
    # merge rather than merely being visible. Renaming the job breaks both
    # rulesets at once, so change the name and the two rulesets together or not
    # at all.
    name: Lint
    # Pinned for the same reason as the Test job: ubuntu-latest moves to a new
    # image on GitHub's schedule, and the hooks below build actionlint with the
    # preinstalled Go, so the image is part of what they run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      # prek arrives as an ordinary devDependency rather than through its own
      # GitHub Action or a hand-pinned pipx install. Three reasons, in order of
      # weight. This repo's Actions policy admits GitHub-owned and
      # verified-creator actions only, with an empty pattern allowlist, so
      # j178/prek-action would be refused at run time. package-lock.json pins
      # the exact build for both this runner and a maintainer's laptop. And
      # Dependabot already watches npm here, so the version stays current on
      # its own, which a version number typed into a run step would not.
      #
      # The package declares no lifecycle scripts and ships its binary through
      # platform-gated optionalDependencies, so --ignore-scripts installs it
      # intact. That was checked rather than assumed.
      #
      # Carries an id for the same reason as in the Test job. There is only one
      # step after it here, so nothing is being unblocked; the gate is there so
      # a failed install skips the hooks instead of adding a second red that
      # only says the prek binary is missing.
      - id: install
        run: npm ci --ignore-scripts

      # --skip unit-tests-coverage: that hook runs "npm run test:coverage",
      # which the Test job already does. Running it twice per pull request buys
      # nothing.
      #
      # --skip no-commit-to-branch: that hook exists to stop a commit being made
      # locally on main or development, and this runner never commits anything.
      # Leaving it in would fail this job on exactly the events where the check
      # matters most. On a pull request actions/checkout resolves the merge ref
      # and leaves HEAD detached, where the hook passes because "git
      # symbolic-ref HEAD" fails; on a push to main or a workflow_dispatch run
      # the same action checks out with "-B main", HEAD sits on a real branch,
      # and the hook fails the run for a commit that was already made and
      # already merged.
      #
      # The flag is repeated rather than given a comma separated list. Measured
      # against the prek in this lockfile: "--skip a,b" is read as one hook name
      # and warns "selector did not match any hooks", then runs both of them.
      #
      # First run on a cold runner builds actionlint with the preinstalled Go
      # and creates a Python env for zizmor, which was about 20 seconds when
      # measured locally. Nothing is cached yet; caching ~/.cache/prek is the
      # next move if this job starts to drag.
      - name: Run the git hooks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --show-diff-on-failure --skip unit-tests-coverage --skip no-commit-to-branch
