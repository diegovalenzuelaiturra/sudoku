name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The "main protection" ruleset requires this check by name. Renaming it
    # blocks every PR until the ruleset's required status check is updated to
    # match, so change both together or not at all.
    name: Test
    runs-on: ubuntu-latest
    # A hung job otherwise runs to GitHub's 360-minute default.
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs. A tag like v7 is mutable, so
      # pinning by tag would let a moved tag swap the action out from under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts would otherwise execute
      # arbitrary code on the runner at install time. Verified the suite passes
      # without them.
      - run: npm ci --ignore-scripts

      - run: npm test
