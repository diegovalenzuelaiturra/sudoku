name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The "main protection" and "development protection" rulesets both require
    # this check by name. Renaming it blocks every PR until the required status
    # check in each of them is updated to match, so change all three together or
    # not at all.
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      # MUST KILL: npm pin repeated in four jobs as env strings, one shared source removes the repeat
      - name: Install npm
        env:
          NPM_VERSION: 12.2.1
          NPM_INTEGRITY: sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-${NPM_VERSION}"
          mkdir -p "$dir/npm" "$dir/bin"
          curl --fail --silent --show-error --location \
            --output "$dir/npm.tgz" \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$dir/npm.tgz" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm ${NPM_VERSION} does not match its pinned integrity" >&2
            exit 1
          fi
          tar -xzf "$dir/npm.tgz" -C "$dir/npm" --strip-components 1
          for cli in npm npx; do
            printf '#!/bin/sh\nexec node "%s/npm/bin/%s-cli.js" "$@"\n' "$dir" "$cli" > "$dir/bin/$cli"
            chmod 755 "$dir/bin/$cli"
          done
          [ "$("$dir/bin/npm" --version)" = "$NPM_VERSION" ]
          echo "$dir/bin" >> "$GITHUB_PATH"

      # MUST KILL: later steps gate on steps.install.outcome, a job boundary would state the gate
      - id: install
        run: npm ci --ignore-scripts

      - name: Build site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Test with coverage floor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage

      - name: Install browsers for Playwright
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:e2e

  lint:
    # Both the "main protection" and "development protection" rulesets now
    # require this check by name, alongside "Test", so a failure here blocks the
    # merge rather than merely being visible. Renaming the job breaks both
    # rulesets at once, so change the name and the two rulesets together or not
    # at all.
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      # MUST KILL: npm pin repeated in four jobs as env strings, one shared source removes the repeat
      - name: Install npm
        env:
          NPM_VERSION: 12.2.1
          NPM_INTEGRITY: sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-${NPM_VERSION}"
          mkdir -p "$dir/npm" "$dir/bin"
          curl --fail --silent --show-error --location \
            --output "$dir/npm.tgz" \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$dir/npm.tgz" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm ${NPM_VERSION} does not match its pinned integrity" >&2
            exit 1
          fi
          tar -xzf "$dir/npm.tgz" -C "$dir/npm" --strip-components 1
          for cli in npm npx; do
            printf '#!/bin/sh\nexec node "%s/npm/bin/%s-cli.js" "$@"\n' "$dir" "$cli" > "$dir/bin/$cli"
            chmod 755 "$dir/bin/$cli"
          done
          [ "$("$dir/bin/npm" --version)" = "$NPM_VERSION" ]
          echo "$dir/bin" >> "$GITHUB_PATH"

      # MUST KILL: later steps gate on steps.install.outcome, a job boundary would state the gate
      - id: install
        run: npm ci --ignore-scripts

      # The flag is repeated rather than given a comma separated list. Measured
      # against the prek in this lockfile: "--skip a,b" is read as one hook name
      # and warns "selector did not match any hooks", then runs both of them.
      - name: Run the git hooks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --show-diff-on-failure --skip unit-tests-coverage --skip no-commit-to-branch
