name: Zizmor

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    # Not "zizmor", for the reason given in codeql.yml: the SARIF upload
    # publishes a check run named after the tool, and two rows with one name is
    # worse than a longer name.
    name: Zizmor audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Publishes findings under Security, Code scanning. Free on public
      # repositories. Granted to third-party code, which is why it is scoped to
      # this one job rather than to the file.
      security-events: write
      contents: read
      # Required by codeql-action/upload-sarif, which this action calls.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MUST KILL: zizmor version repeated from .pre-commit-config.yaml and guarded only by a test, one source would remove the repeat
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.31.1"
