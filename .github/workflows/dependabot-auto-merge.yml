name: Dependabot auto-merge

# Clears open Dependabot pull requests once "development protection" is
# satisfied, which here means Test green, Lint green, CodeQL and zizmor
# reporting no error level alerts, the branch up to date with its base, and the
# commit signed. GitHub refuses any merge the ruleset does not allow, so the
# gate is the gate a person faces.
#
# The ruleset covers less than the tree runs, and the OSV scan is the gap that
# matters: a bump can be mergeable with that scan red, in the state GitHub calls
# UNSTABLE. gh merges that state on sight, so the case below holds it for a
# person to read. That is the one judgement this file makes on its own.
#
# What this replaces is a person typing "gh pr merge" after watching the checks
# go green on a one line version bump. The judgement worth a human stays where
# it was: the seven day cooldown in dependabot.yml decides whether a release is
# old enough to trust, and this runs long after that decision was made.
#
# A schedule rather than a pull request trigger, and that is the whole design.
# The obvious shape for this is pull_request_target, because a workflow
# Dependabot triggers through pull_request gets a read only token and cannot
# enable auto-merge on anything. zizmor rejects that shape twice over, and it is
# right to: dangerous-triggers, because pull_request_target hands the base
# repository's token to a run started by a pull request, and bot-conditions,
# because github.actor is spoofable and is therefore not something to gate a
# merge on. Both are high severity, both block the merge through the code
# scanning rule, and suppressing them would have been the wrong answer to a
# correct finding.
#
# On a schedule none of that arises. The run belongs to this branch, nothing
# from a pull request is checked out or executed, and the author filter below is
# answered by the API rather than by an event payload an attacker can shape.
#
# The cost is that a schedule only ever runs on the default branch, so this file
# does nothing until it reaches main through a release, and a new pull request
# waits at most six hours to be queued. Neither matters for a dependency bump
# that already waited a week to exist.
on:
  schedule:
    # Four times a day, off the hour. GitHub drops scheduled runs when too many
    # land on the same minute, and the top of the hour is where everyone puts
    # them.
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  queue:
    name: Clear Dependabot merges
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # A squash writes to the branch, and enabling auto-merge writes to the
      # pull request. Nothing else here needs a scope, and the workflow level
      # default above is none at all.
      contents: write
      pull-requests: write
    steps:
      # Squash, matching how every pull request reaches development. Releases
      # are merge commits and are untouched by this: it only ever looks at pull
      # requests based on development.
      - name: Merge or queue every open Dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A release merge lands on main, and development is fast forwarded
          # onto it afterwards. A squash that lands on development inside that
          # window leaves the two branches with no common tip, and CLAUDE.md
          # records that divergence as the cause of repair pull request #36 and
          # three releases of drift. compare answers ahead or identical only
          # while main holds nothing development is missing.
          window=$(gh api "repos/$REPO/compare/main...development" --jq .status || echo unknown)
          case "$window" in
            ahead | identical) ;;
            *)
              echo "::notice::development is $window main, so a release fast forward is pending. Nothing merged."
              exit 0
              ;;
          esac

          # "app/dependabot" is how the API names the bot, and asking the API
          # who opened a pull request is what makes this unspoofable. A title or
          # a branch name would not be. The same call carries the merge state,
          # so the loop below reads the API once for the whole backlog.
          gh pr list --repo "$REPO" \
            --author "app/dependabot" \
            --base development \
            --state open \
            --json number,mergeStateStatus \
            --jq '.[] | "\(.number) \(.mergeStateStatus)"' > prs.txt

          if [ ! -s prs.txt ]; then
            echo "No open Dependabot pull requests."
            exit 0
          fi

          merged=0
          failed=0

          # Every call passes --body "", because the repository default for a
          # squash body is PR_BODY, and a Dependabot body runs to tens of
          # thousands of characters of changelog HTML that has carried the em
          # dashes this tree bans from a commit message.
          while read -r pr state; do
            echo "#${pr} is ${state}"

            case "$state" in
              # Green and up to date. gh sends a plain merge for these states,
              # with or without --auto, so this names what it does.
              CLEAN | HAS_HOOKS)
                # The ruleset requires a branch up to date with its base, so the
                # first merge of a run puts every remaining pull request behind
                # it, and the states read above stop describing them.
                if [ "$merged" -ne 0 ]; then
                  echo "::notice::#${pr} is now behind this run's merge, the next run takes it"
                  continue
                fi
                if gh pr merge --squash --body "" --repo "$REPO" "$pr"; then
                  merged=1
                else
                  echo "::warning::Could not merge #${pr}"
                  failed=$((failed + 1))
                fi
                ;;
              # Mergeable with a check outside the ruleset red or still running.
              # The OSV scan is one of those: it gates neither required_status_checks
              # nor the code scanning rule. gh merges this state on sight, so an
              # advisory would reach development unread. A person reads it.
              UNSTABLE)
                echo "::warning::#${pr} has a check outside the ruleset that is red or pending, left open"
                ;;
              # Dependabot rebases its own branches, and a push from this token
              # would be worse than waiting: GitHub starts no workflow run from
              # GITHUB_TOKEN, so Test and Lint would never report on the new head
              # and the pull request could never satisfy the ruleset again.
              BEHIND)
                echo "::notice::#${pr} is behind, Dependabot rebases it"
                ;;
              # A conflict, a draft, or a state GitHub has not finished
              # computing. All three are answered by the next run.
              DIRTY | DRAFT | UNKNOWN)
                echo "::notice::#${pr} is ${state}, nothing to do this run"
                ;;
              # Checks still running, which is what the queue is for.
              *)
                if gh pr merge --auto --squash --body "" --repo "$REPO" "$pr"; then
                  echo "#${pr} queued"
                else
                  echo "::warning::Could not queue #${pr}"
                  failed=$((failed + 1))
                fi
                ;;
            esac
          done < prs.txt

          # One failure does not stop the rest, and the run still ends red. A
          # green scheduled run notifies nobody, and a run that reports success
          # while merging nothing is the one outcome this file cannot have.
          if [ "$failed" -ne 0 ]; then
            echo "${failed} pull request(s) could not be merged or queued."
            exit 1
          fi
