version: 2

# A note that applies to every entry below, because it is the whole reason the
# cooldowns are safe to set: cooldown affects VERSION updates only. GitHub does
# not apply it to Dependabot SECURITY updates, so a published advisory still
# produces a pull request immediately.

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
      semver-major-days: 14
    # oxlint and eslint-plugin-oxlint cannot move one at a time. The plugin
    # declares a tilde peer on oxlint, so a pull request that raises either one
    # alone leaves a lockfile npm ci refuses, and the refusal lands at the
    # install step, before Test or Lint has run a single check.
    groups:
      oxlint:
        patterns:
          - oxlint
          - eslint-plugin-oxlint

  - package-ecosystem: pre-commit
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # The note at the top of this file holds here as well: cooldown delays
    # version updates only and never holds back a Dependabot security update.
    # Worth recording plainly, though, that GitHub's supported ecosystems table
    # marks pre-commit as version updates only, with security updates
    # unsupported, so on this entry there is no security path for the cooldown
    # to leave alone.
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"
