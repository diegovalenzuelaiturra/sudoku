version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      oxlint:
        patterns:
          - oxlint
          - eslint-plugin-oxlint

  - package-ecosystem: pre-commit
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"
