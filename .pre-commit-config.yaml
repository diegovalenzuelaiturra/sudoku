# MUST KILL: prek ignores this key, so it only binds plain pre-commit and guards nothing in this repo
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: ["--no-progress", "--offline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all, --maxkb=1024]

      - id: check-case-conflict

      # MUST KILL: types overrides the upstream json type, so .webmanifest is covered only by this files regex
      - id: check-json
        types: [file]
        files: \.(json|webmanifest)$

      - id: check-merge-conflict
        args: [--assume-in-merge]

      - id: check-vcs-permalinks

      - id: check-yaml

      # MUST KILL: CI skips this hook because it fails on any run from main or development, so a commit-time only split removes the skip
      - id: no-commit-to-branch
        args: [--branch=main, --branch=development]

      - id: end-of-file-fixer

      - id: mixed-line-ending
        args: [--fix=lf]

      # Two trailing spaces are a line break in markdown, so keep them there.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: text-unicode-replacement-char

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npm run --silent lint:oxlint
        language: system
        pass_filenames: false
        files: \.(m?js|html)$|^\.oxlintrc\.json$

      - id: eslint
        name: eslint
        entry: npm run --silent lint:eslint
        language: system
        pass_filenames: false
        files: \.(m?js|html)$|^\.oxlintrc\.json$

      - id: biome
        name: biome
        entry: npm run --silent lint:biome
        language: system
        pass_filenames: false
        files: \.(m?js|html|css)$|^biome\.json$

      # MUST KILL: file scope is copied from the lint:spelling script, so a new player facing file must be added in both places
      - id: cspell
        name: cspell
        entry: npm run --silent lint:spelling
        language: system
        pass_filenames: false
        files: ^(index\.html|404\.html|app\.js|cspell\.config\.mjs)$

      # MUST KILL: files regex is hand copied, and a path missing from it silently skips the workflow guard test
      - id: unit-tests-coverage
        name: unit tests with coverage floor
        entry: npm run test:coverage
        language: system
        pass_filenames: false
        files: ^(scripts/|tests/|e2e/|\.github/workflows/|index\.html|app\.js|stats\.js|generator\.js|sw\.js|manifest\.webmanifest|404\.html|robots\.txt|package(-lock)?\.json|icons/)
